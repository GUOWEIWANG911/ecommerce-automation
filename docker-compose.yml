version: '3.8'

services:
  test-runner:
    build: .
    # 挂载结果目录，实现测试与报告容器共享数据
    volumes:
      # 1. 挂载 Playwright HTML 报告目录
      - ./playwright-report:/app/playwright-report
      # 2. 挂载 Trace 追踪文件目录（用于调试）
      - ./traces:/app/traces
      # 3. (可选) 挂载 Blob 报告目录，方便本地合并多个 CI 分片的报告
      - ./blob-report:/app/blob-report
    environment:
      # --- 环境变量配置 ---
      # Playwright 会自动检测 CI=true，无需手动配置 Headless 参数
      - CI=true
      
      # 业务逻辑相关的环境变量
      - TEST_USERNAME=${TEST_USERNAME}
      - TEST_PASSWORD=${TEST_PASSWORD}
      - BASE_URL=${BASE_URL:-https://www.petstore.com}
      
      # 安全配置
      - SECURITY_ENABLED=${SECURITY_ENABLED:-false}
      
      # (可选) 如果你想强制指定浏览器，可以加这个，否则默认使用 Dockerfile 里装的 chromium
      # - PLAYWRIGHT_BROWSERS_PATH=0
      # CI 环境中，测试容器退出后自动停止所有服务
      # 本地开发时，可以注释掉下面两行，保持 Allure 服务持续运行
    profiles:
      - ci
    # 确保测试运行完自动退出
    command: pytest -v
      
  # --- 报告服务 (可选) ---
  # 如果你习惯用浏览器实时查看报告，可以保留这个服务
  # 但 Playwright 的 HTML 报告通常是静态文件，直接挂载查看即可，不一定需要独立服务
  # 这里为了保持和你原配置结构一致，保留了一个通用的 web 服务示例
  report-server:
    image: nginx:alpine
    ports:
      - "9323:80"
    volumes:
      - ./playwright-report:/usr/share/nginx/html
    profiles:
      - report
    # 只有当你想通过 http://localhost:9323 查看报告时才启动这个 profile